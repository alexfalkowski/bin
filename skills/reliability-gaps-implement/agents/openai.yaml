interface:
  display_name: "Reliability Gaps Implement"
  short_description: "Implement confirmed reliability findings"
  default_prompt: "Use $reliability-gaps-implement to implement a confirmed reliability entry only when explicitly requested; explain informational fixes read-only, resolve entry ID follow-ups through ledger.yaml, and use $reliability-gaps-find to find gaps. For behavior-changing work, state the expected failure signal and accept Red only after the command runs during the current work, the command and its real output are pasted and inspected, its match to the intended missing behavior is explained, and required command output is never invented, reconstructed, or paraphrased."
