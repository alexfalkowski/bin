interface:
  display_name: "Project Gaps Implement"
  short_description: "Implement confirmed project workflow gaps"
  default_prompt: "Use $project-gaps-implement to implement a confirmed project workflow entry only when explicitly requested; explain informational fixes read-only, resolve entry ID follow-ups through ledger.yaml, and use $project-gaps-find to find gaps. For behavior-changing work, use `Behavior`, `Evidence`, `Change`, `Refactor`, and `Validation` before editing and at completion; follow the established validation path and report only commands and outcomes actually observed without prescribing test or implementation order."
