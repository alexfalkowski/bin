interface:
  display_name: "Project Gaps Find"
  short_description: "Find and rank project workflow gaps"
  default_prompt: "Use $project-gaps-find to trace supported in-scope developer workflows and rank build, CI, Makefile, release, setup, validation, and workflow gaps by concrete benefit and ongoing cost without edits. Use repo archetype lead generation, collect exact-revision CircleCI evidence with the shared gap-workflow collector when configured, otherwise use the repository-owned evidence path, reuse exact-state green CI evidence, apply the shared delegation gate and sizing, classify implementation home as current repo, shared bin, external repo, or mixed, and hand confirmed entries to $project-gaps-implement."
