interface:
  display_name: "Doc Gaps Fix"
  short_description: "Find and fix scoped documentation gaps"
  default_prompt: "Use $doc-gaps-fix to find and fix scoped documentation gaps when edits are requested; resolve entry ID follow-ups through ledger.yaml, or use $doc-gaps-audit for an audit-only pass. For unresolved-ledger behavior changes, state the expected failure signal and accept Red only after the command runs during the current work, the command and its real output are pasted and inspected, its match to the intended missing behavior is explained, and required command output is never invented, reconstructed, or paraphrased."
