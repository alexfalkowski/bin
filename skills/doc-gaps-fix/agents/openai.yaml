interface:
  display_name: "Doc Gaps Fix"
  short_description: "Find and fix scoped documentation gaps"
  default_prompt: "Use $doc-gaps-fix to find and fix scoped documentation gaps when edits are requested; collect exact-revision CircleCI evidence with the shared gap-workflow collector when configured, otherwise use the repository-owned evidence path, and reuse exact-state green CI evidence during discovery, resolve entry ID follow-ups through ledger.yaml, or use $doc-gaps-audit for an audit-only pass; report only commands and outcomes actually observed."
