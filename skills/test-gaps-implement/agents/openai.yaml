interface:
  display_name: "Test Gaps Implement"
  short_description: "Implement confirmed test coverage gaps"
  default_prompt: "Use $test-gaps-implement to implement a confirmed test-gap entry only when explicitly requested; explain informational fixes read-only, resolve entry ID follow-ups through ledger.yaml, and use $test-gaps-find to find gaps. For behavior-changing work, use `Behavior`, `Coverage`, `Change`, `Refactor`, and `Validation` before editing and at completion; follow the established harness and report only commands and outcomes actually observed without prescribing test or implementation order."
