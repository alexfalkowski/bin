interface:
  display_name: "Test Gaps Find"
  short_description: "Find weak tests and harness gaps"
  default_prompt: "Use $test-gaps-find to find scoped missing, weak, flaky, wrong-layer, or brittle coverage without editing. After scoping, use repo archetype lead generation, collect exact-revision CircleCI evidence with the shared gap-workflow collector when configured, otherwise use the repository-owned evidence path, reuse exact-state green CI evidence, apply the shared delegation gate, and hand confirmed entries to $test-gaps-implement."
