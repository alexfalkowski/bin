interface:
  display_name: "Feature Gaps Implement"
  short_description: "Implement confirmed feature proposals"
  default_prompt: "Use $feature-gaps-implement to implement a confirmed feature entry only when explicitly requested; explain informational proposals read-only, resolve entry ID follow-ups through ledger.yaml, and use $feature-gaps-find to find gaps. For behavior-changing work, use `Behavior`, `Coverage`, `Change`, `Refactor`, and `Validation` before editing and at completion; follow the established harness and report only commands and outcomes actually observed without prescribing test or implementation order."
