interface:
  display_name: "Feature Gaps Implement"
  short_description: "Implement confirmed feature proposals"
  default_prompt: "Use $feature-gaps-implement to implement a confirmed feature entry only when explicitly requested; explain informational proposals read-only, resolve entry ID follow-ups through ledger.yaml, and use $feature-gaps-find to find gaps. For behavior-changing work, state the expected failure signal and accept Red only after the command runs during the current work, the command and its real output are pasted and inspected, its match to the intended missing behavior is explained, and required command output is never invented, reconstructed, or paraphrased."
