interface:
  display_name: "Code Issues Implement"
  short_description: "Implement confirmed code-issue entries"
  default_prompt: "Use $code-issues-implement to implement a confirmed code issue only when explicitly requested; explain informational fix questions read-only, resolve entry ID follow-ups through ledger.yaml, and use $code-issues-find to find issues. For behavior-changing work, state the expected failure signal and accept Red only after the command runs during the current work, the command and its real output are pasted and inspected, its match to the intended missing behavior is explained, and required command output is never invented, reconstructed, or paraphrased."
