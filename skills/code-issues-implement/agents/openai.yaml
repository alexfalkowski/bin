interface:
  display_name: "Code Issues Implement"
  short_description: "Implement confirmed code-issue entries"
  default_prompt: "Use $code-issues-implement to implement a confirmed code issue only when explicitly requested; explain informational fix questions read-only, resolve entry ID follow-ups through ledger.yaml, and use $code-issues-find to find issues. For behavior-changing work, use `Behavior`, `Coverage`, `Change`, `Refactor`, and `Validation` before editing and at completion; follow the established harness and report only commands and outcomes actually observed without prescribing test or implementation order."
