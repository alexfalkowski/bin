interface:
  display_name: "Go Standards"
  short_description: "Apply Go code, docs, and test conventions"
  default_prompt: "Use $go-standards for Go code, APIs, docs, imports, tests, benchmarks, and fuzzing. Pair with $naming-standards and $doc-standards as needed; keep production package names lowercase without separators, preserve external test package suffixes, declare exported constants individually with doc comments and blank lines between declarations, group private constants by responsibility and consolidate standalone declarations with related groups, keep blank lines before individually commented entries, group each constructor, struct, and its methods in that order within a file, put package functions unrelated to structs at the top when exported and at the bottom when unexported, keep contracts simple, follow dominant harnesses before adding *_test.go files, require concrete benchmark/fuzz rationale, avoid thin-wrapper coverage, sketch exported callers and package ownership against supported repository patterns, assess the full caller-facing surface before visibility changes, keep decoding and HTTP error mapping at existing adapters, and MUST NOT invent import aliases for readability, caution, brevity, or personal clarity."
