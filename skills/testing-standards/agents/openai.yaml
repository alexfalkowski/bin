interface:
  display_name: "Testing Standards"
  short_description: "Design focused behavior tests"
  default_prompt: "Use $testing-standards to design or review tests around the real caller and established harness; for behavior-changing implementation, require both the smallest implementation and credible behavior coverage, allow either order, and run the narrowest supported selector after both are in place. Keep local tests scoped to changed packages and graph-proven direct dependents, leave the full suite to CI, avoid API-shaping, implementation-only, source-inspection, cryptic, and wrong-layer tests, treat test removal as a coverage decision, perform the required two-pass or risk-triggered three-pass refactor assessment and a mutation-style gap scan, and report only repository-defined validation actually observed."
